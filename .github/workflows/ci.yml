name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.1.1
      - name: Compile observer
        working-directory: backend/observer
        run: python -m py_compile scanner.py cyber_scout/*.py
      - name: Test observer
        working-directory: backend/observer
        run: python -m pytest -q tests
      - run: python -m pip install -r simulation/requirements.txt pip-audit==2.10.1
      - run: pip-audit -r simulation/requirements.txt
      - name: Compile and test isolated simulator
        working-directory: simulation/backend
        run: |
          python -m py_compile app.py
          python -m pytest -q test_app.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend

  repository-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject common committed credential formats
        run: |
          ! git grep -nE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})'
      - name: Reject runtime and nested repository artifacts
        run: |
          test -z "$(find . -path ./.git -prune -o -type d -name .git -print)"
          test -z "$(find . -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.pcap' -o -name '*.pcapng' -o -name '.env' \) -print)"
